<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matriz de Colores</title>
    <link rel="stylesheet" href="r4.css">
</head>
<body>
    <div class="palette-container">
        <div class="color-grid">

            <div class="swatch c-indigo-400"></div>
            <div class="swatch c-violet-400"></div>
            <div class="swatch c-purple-400"></div>
            <div class="swatch c-fuchsia-400"></div>
            <div class="swatch c-pink-400"></div>
            <div class="swatch c-rose-400"></div>

            <div class="swatch c-indigo-500"></div>
            <div class="swatch c-violet-500"></div>
            <div class="swatch c-purple-500"></div>
            <div class="swatch c-fuchsia-500"></div>
            <div class="swatch c-pink-500"></div>
            <div class="swatch c-rose-500"></div>

            <div class="swatch c-indigo-600"></div>
            <div class="swatch c-violet-600"></div>
            <div class="swatch c-purple-600"></div>
            <div class="swatch c-fuchsia-600"></div>
            <div class="swatch c-pink-600"></div>
            <div class="swatch c-rose-600"></div>

            <div class="swatch c-indigo-700"></div>
            <div class="swatch c-violet-700"></div>
            <div class="swatch c-purple-700"></div>
            <div class="swatch c-fuchsia-700"></div>
            <div class="swatch c-pink-700"></div>
            <div class="swatch c-rose-700"></div>

            <!-- Fila 5 (Tono 800) -->
            <div class="swatch c-indigo-800"></div>
            <div class="swatch c-violet-800"></div>
            <div class="swatch c-purple-800"></div>
            <div class="swatch c-fuchsia-800"></div>
            <div class="swatch c-pink-800"></div>
            <div class="swatch c-rose-800"></div>

            <!-- Fila 6 (Tono 900) -->
            <div class="swatch c-indigo-900"></div>
            <div class="swatch c-violet-900"></div>
            <div class="swatch c-purple-900"></div>
            <div class="swatch c-fuchsia-900"></div>
            <div class="swatch c-pink-900"></div>
            <div class="swatch c-rose-900"></div>
        </div>
    </div>
</body>
</html>
