<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colores de Fondo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="main-container">
        <h1 class="title">COLORES DE FONDO</h1>
        
        <div class="bg-grid">
            <div class="color-box bg-blue-gray-top span-4">Blue Gray</div>
            
            <div class="color-box bg-cool-gray">Cool gray</div>
            <div class="color-box bg-warm-gray">Warm Gray</div>
            <div class="color-box bg-amber">Amber</div>
            <div class="color-box bg-green">Green</div>
            
            <div class="color-box bg-gray">Gray</div>
            <div class="color-box bg-red">Red</div>
            <div class="color-box bg-yellow">Yellow</div>
            <div class="color-box bg-emerald">Emerald</div>
            
            <div class="color-box bg-true-gray">True Gray</div>
            <div class="color-box bg-orange">Orange</div>
            <div class="color-box bg-lime">Lime</div>
            <div class="color-box bg-teal">Teal</div>
            
            <div class="color-box bg-fuchsia">Fuchsia</div>
            <div class="color-box bg-pink">Pink</div>
            <div class="color-box bg-rose span-2">Rose</div>
            
            <div class="color-box bg-purple">Purple</div>
            <div class="color-box bg-violet">Violet</div>
            <div class="color-box bg-indigo">Indigo</div>
            <div class="color-box bg-blue">Blue</div>
            
            <div class="color-box bg-sky span-2">Sky</div>
            <div class="color-box bg-cyan span-2">Cyan</div>
        </div>
    </div>
</body>
</html>
